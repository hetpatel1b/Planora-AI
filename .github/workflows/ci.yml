name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Run unit & component tests with coverage enforcement
        run: npm run test:coverage

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-publishable-key-for-ci-build-only"
        run: npm run build

  db-security:
    name: Database RLS & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify PostgreSQL client
        run: |
          if ! command -v psql &> /dev/null; then
            echo "Installing postgresql-client..."
            sudo apt-get update -y && sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Start isolated local Supabase
        run: |
          supabase start
          LOCAL_DB_URL=$(supabase status -o json | jq -r '.DB_URL // empty')
          if [ -z "$LOCAL_DB_URL" ]; then
            LOCAL_DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d '=' -f2- | tr -d '"')
          fi
          if [ -z "$LOCAL_DB_URL" ]; then
            LOCAL_DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fi
          echo "SUPABASE_DB_URL=$LOCAL_DB_URL" >> $GITHUB_ENV

      - name: Run Transactional RLS Security Tests
        run: psql -v ON_ERROR_STOP=1 -d "$SUPABASE_DB_URL" -f supabase/tests/rls_isolation_test.sql

      - name: Run Budget Scenario RPC Security Tests
        run: psql -v ON_ERROR_STOP=1 -d "$SUPABASE_DB_URL" -f supabase/tests/apply_budget_scenario_test.sql

  e2e:
    name: Playwright Real-Browser E2E Tests
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase container & seed E2E credentials
        run: |
          supabase start
          API_URL=$(supabase status -o json | jq -r '.API_URL // "http://127.0.0.1:54321"')
          ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY // empty')
          if [ -z "$ANON_KEY" ]; then
            ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d '=' -f2- | tr -d '"')
          fi
          LOCAL_DB_URL=$(supabase status -o json | jq -r '.DB_URL // empty')
          if [ -z "$LOCAL_DB_URL" ]; then
            LOCAL_DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d '=' -f2- | tr -d '"')
          fi
          if [ -z "$LOCAL_DB_URL" ]; then
            LOCAL_DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fi

          echo "LOCAL_SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "LOCAL_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV

          # Provision ephemeral E2E test user in local Supabase container
          E2E_EMAIL="e2e_ci_runner@planora.local"
          E2E_PASS="E2ETestSecretPass123!"

          curl -s -X POST "$API_URL/auth/v1/signup" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASS\"}" || true

          # Ensure email confirmation is marked confirmed in local PostgreSQL
          psql -d "$LOCAL_DB_URL" -c "UPDATE auth.users SET email_confirmed_at = now() WHERE email = '$E2E_EMAIL';" || true

          echo "E2E_TEST_USER_EMAIL=$E2E_EMAIL" >> $GITHUB_ENV
          echo "E2E_TEST_USER_PASSWORD=$E2E_PASS" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests against isolated Supabase instance
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          E2E_TEST_USER_EMAIL: ${{ env.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ env.E2E_TEST_USER_PASSWORD }}
        run: npm run test:e2e
