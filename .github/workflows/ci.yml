name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Run unit & component tests with coverage enforcement
        run: npm run test:coverage

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-publishable-key-for-ci-build-only"
        run: npm run build

  db-security:
    name: Database RLS & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase
        run: supabase start

      - name: Run Transactional RLS Security Tests
        run: supabase db query --local -f supabase/tests/rls_isolation_test.sql

      - name: Run Budget Scenario RPC Security Tests
        run: supabase db query --local -f supabase/tests/apply_budget_scenario_test.sql

  e2e:
    name: Playwright Real-Browser E2E Tests
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-publishable-key-for-ci-build-only"
        run: npm run test:e2e
